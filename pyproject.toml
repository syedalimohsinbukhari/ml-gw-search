[project]
name = "ml-gw-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "black>=26.5.1",
    "blosc>=1.11.4",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotez>=0.3.2.post1",
    "pycbc>=2.9.0",
    "pyqt6>=6.11.0",
    "setuptools==80.0.0",
    "tables>=3.10.1",
    "torch",
    "tqdm>=4.67.3",
    "typer>=0.25.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
